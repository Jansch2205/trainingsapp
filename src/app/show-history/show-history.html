<div class="page-shell">
  <div class="content">
    <header class="topbar">
      <button mat-flat-button class="button secondary" routerLink="/exercise/{{workout.id}}/{{exercise.id}}">Zurück</button>
      <h1 class="headline">{{exercise.machineNumber === 0 ? "" : exercise.machineNumber}} {{exercise.name}}</h1>
    </header>

    <mat-card-content class="chart-panel">
      <div class="chart-container">
        <canvas
          baseChart
          [data]="lineChartData"
          [options]="lineChartOptions"
          [type]="'line'">
        </canvas>
      </div>
    </mat-card-content>
  </div>
</div>
