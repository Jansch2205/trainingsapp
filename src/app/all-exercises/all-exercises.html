<div class="content">
  <h1 class="headline">Alle Übungen</h1>
  <div class="button-row">
    <button mat-flat-button class="button blue" routerLink="/">Zurück</button>
    <button mat-flat-button class="button blue" (click)="deleteAll()">Alle löschen</button>
  </div>
  @for(exercise of exercises; track exercise.id) {
    <div class="exercise">
      <h2>{{exercise.machineNumber === 0 ? "" : exercise.machineNumber}} {{exercise.name}}</h2>
      @if (exercise.notes !== "") {
        <p>{{exercise.notes}}</p>
      }
    </div>
    <div>
      <button matFab (click)="editExercise(exercise)" class="button">
        <mat-icon>edit</mat-icon>
      </button>
      <button matFab (click)="deleteOnePopup(exercise.id)" class="button">
        <mat-icon>delete</mat-icon>
      </button>
    </div>
    <p class="divider"></p>
  }
</div>
