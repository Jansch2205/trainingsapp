<div class="page-shell">
  <div class="content">
    <header class="topbar">
      <button mat-flat-button class="button secondary" [routerLink]="workout ? '/workout/' + workout.id : '/'">Zurück</button>
      <h1 class="headline">{{workout ? workout.name : "Alle Workouts"}}</h1>
    </header>

    @if (!workout) {
      <label class="filter-row">
        <span>Gruppe</span>
        <select [(ngModel)]="selectedGroup" (ngModelChange)="onGroupFilterChange($event)">
          <option value="all">Alle Gruppen</option>
          @for (group of groups; track group) {
            <option [value]="group">{{ group }}</option>
          }
        </select>
      </label>
    }

    <div class="list">
      @for (activity of finishedHistory; track activity){
        <div class="activity-item">
          <div class="index">{{ workout ? $count - $index : activity.split('%')[0] }}</div>
          <div class="activity-copy">
            @if (!workout) {
              <small class="group-label">{{ activity.split('%')[1] }}</small>
            }
            <span>{{ workout ? activity : activity.split('%')[2] }}</span>
          </div>
        </div>
      }
    </div>
  </div>
</div>
