<div class="content">
  <h1 class="headline">{{workout ? workout.name : "Alle Workouts"}}</h1>
  <div class="button-row">
    <button mat-flat-button class="button blue" [routerLink]="workout ? '/workout/' + workout.id : '/'">Zurück</button>
  </div>
  <div class="list">
    @for (activity of finishedHistory; track activity){
        <div class="activity-item">
          <h3>{{ workout ? $count - $index : activity.split('%')[0] }}</h3>
          <span>{{ workout ? activity : activity.split('%')[1] }}</span>
        </div>
    }
  </div>
</div>
