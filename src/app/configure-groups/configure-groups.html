<div class="content">
  <h1 class="headline">Gruppen verwalten</h1>
  <div class="button-row">
    <button mat-flat-button class="button blue" routerLink="/">Zurück</button>
    <button mat-flat-button class="button blue" (click)="addGroup()">Gruppe Hinzufügen</button>
  </div>

  @for(group of groups; track group.name) {
    <div class="exercise">
      <h2>{{group.name}}</h2>
    </div>
    @for (workout of group.workoutName; track workout) {
      <p>{{workout}}</p>
    }
    <div>
      <button matFab (click)="editGroup(group)" class="button">
        <mat-icon>edit</mat-icon>
      </button>
      <button matFab (click)="deleteOnePopup(group.name)" class="button">
        <mat-icon>delete</mat-icon>
      </button>
    </div>
    <p class="divider"></p>
  }
</div>
